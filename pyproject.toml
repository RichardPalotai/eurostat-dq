[project]
name = "eurostat-dq"
version = "0.1.0"
description = "Eurostat data-quality pipeline: ingest, validate, and report on Eurostat datasets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "eurostat>=1.1.1",
    "requests>=2.32",
    "pandas>=3.0",
    "pyarrow>=21.0",
    "numpy>=2.5",
    "scipy>=1.14",
    "pydantic>=2.13",
    "great_expectations>=1.19",
    "scikit-learn>=1.9",
    "matplotlib>=3.11",
    "geopandas>=1.1",
    "mapclassify>=2.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "jupyter>=1.1",
    "ipykernel>=7.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
eurostat-dq = "eurostat_dq.cli:main"
